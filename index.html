<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>インク・ドロー・パルクール (INK DRAW PARKOUR)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <canvas id="game-canvas"></canvas>

    <!-- HUD: インクゲージ & ステータス -->
    <header id="game-hud" class="hud" aria-label="Game HUD">
      <div class="hud-top">
        <div class="brand">
          <span class="brand-mark"></span>
          <div class="brand-text">
            <span class="brand-title">インク・パルクール</span>
            <span id="hud-stage-label" class="hud-stage-label">ステージ 01 — 最初の橋</span>
          </div>
        </div>
        <div class="ink-panel">
          <div class="ink-header">
            <span class="ink-label">インク残量</span>
            <span id="ink-value" class="ink-value">100%</span>
          </div>
          <div class="ink-bar-track">
            <div id="ink-bar-fill" class="ink-bar-fill"></div>
          </div>
        </div>
        <div class="hud-actions">
          <button id="quick-reset-btn" class="ghost-btn" type="button">リセット</button>
          <button id="hud-menu-btn" class="ghost-btn" type="button">メニュー</button>
          <button id="settings-btn" class="ghost-btn" type="button">設定</button>
        </div>
      </div>
      <p id="hud-hint" class="hud-hint">ドラッグやスワイプでインクの足場を描いてください — 線は3.5秒後に消滅します</p>
    </header>

    <!-- メインメニュー画面 -->
    <div id="main-menu-overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="menu-title">
      <div class="modal-card menu-card">
        <div class="menu-header">
          <div class="menu-header-top">
            <div class="menu-kicker-row">
              <span class="brand-mark"></span>
              <p class="modal-kicker">2D物理インクアクション</p>
            </div>
            <button id="menu-settings-btn" class="ghost-btn" type="button">設定</button>
          </div>
          <h1 id="menu-title" class="menu-title">インク・ドロー・パルクール</h1>
          <p class="menu-subtitle">マウスや指で描いた線がリアルタイムで足場になるパルクールゲーム。遊びたいステージを選択してください。</p>
        </div>

        <div class="stage-section">
          <div class="stage-section-header">
            <span class="stage-section-title">ステージ選択</span>
            <span id="stage-progress-text" class="stage-progress-text">0 / 5 クリア済み</span>
          </div>
          <div id="stage-grid" class="stage-grid">
            <!-- main.js で動的に生成 -->
          </div>
        </div>
      </div>
    </div>

    <!-- ステージクリア / ゲームオーバー モーダル -->
    <div id="overlay" class="overlay hidden" role="dialog" aria-modal="true">
      <div class="modal-card">
        <p id="overlay-kicker" class="modal-kicker">結果</p>
        <h2 id="overlay-title" class="modal-title">ステージクリア</h2>
        <p id="overlay-message" class="modal-message">ゴールに到達しました。</p>
        <div class="modal-stats">
          <div class="stat-item">
            <span class="stat-label">クリアタイム</span>
            <span id="stat-time" class="stat-value">0.00s</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">インク使用量</span>
            <span id="stat-ink" class="stat-value">0px</span>
          </div>
        </div>
        <div class="modal-actions modal-actions-stack">
          <button id="next-stage-btn" class="primary-btn btn-hidden" type="button">次のステージへ</button>
          <div class="modal-actions-row">
            <button id="retry-btn" class="primary-btn" type="button">もう一度</button>
            <button id="overlay-menu-btn" class="ghost-btn" type="button">メニュー</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 設定モーダル（サウンド・画面振動） -->
    <div id="settings-overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="modal-card">
        <p class="modal-kicker">環境設定</p>
        <h2 id="settings-title" class="modal-title">設定</h2>
        <div class="settings-list">
          <div class="setting-row">
            <div class="setting-info">
              <span class="setting-name">効果音 (サウンド)</span>
              <span class="setting-desc">Web Audio シンセサイザーSE</span>
            </div>
            <button id="sound-toggle-btn" class="toggle-btn active" type="button" aria-pressed="true">ON</button>
          </div>
          <div class="setting-row">
            <div class="setting-info">
              <span class="setting-name">画面の揺れ (振動演出)</span>
              <span class="setting-desc">着地やジャンプ時のカメラ振動</span>
            </div>
            <button id="shake-toggle-btn" class="toggle-btn active" type="button" aria-pressed="true">ON</button>
          </div>
        </div>
        <div class="modal-actions">
          <button id="settings-close-btn" class="primary-btn" type="button">閉じる</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Matter.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
